services:
  images:
    container_name: images
    image: nginx:1.30.4
    restart: unless-stopped
    networks:
      - traefik_network
    volumes:
      - ./www/:/images
      - ./vhosts/prod:/etc/nginx/conf.d
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      - traefik.http.services.images.loadbalancer.server.port=80
      - traefik.http.routers.images.rule=Host(`images.gainsbourg.net`)
      - traefik.http.routers.images.entrypoints=websecure
      - traefik.http.routers.images.service=images
      - traefik.http.routers.images.tls=true
      - traefik.http.routers.images.tls.certresolver=myresolver

networks:
  traefik_network:
    external: true
